spring.datasource.url=jdbc:h2:mem:tcms;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
jwt.secret=test-only-signing-secret-that-is-at-least-thirty-two-bytes
jwt.accessTokenExpiry=7200000
jwt.refreshTokenExpiry=172800000
