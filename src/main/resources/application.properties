# Load optional local settings from the repository working directory.
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tcms}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
server.servlet.context-path=/dhtcms/api/v1
logging.level.org.springframework.security=INFO

jwt.secret=${JWT_SECRET}
jwt.accessTokenExpiry=7200000
jwt.refreshTokenExpiry=172800000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jackson.serialization.fail-on-empty-beans=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Workers are disabled until an explicit credential and project scope are configured.
automation.worker.token=${AUTOMATION_WORKER_TOKEN:}
automation.worker.project-id=${AUTOMATION_WORKER_PROJECT_ID:0}
