name: Build and test
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Install Chromium for browser automation tests
        run: mvn --batch-mode test-compile exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"
      - run: mvn --batch-mode verify
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tms-react-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: tms-react-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
